name: eco_traveler
description: "고유가 시대 친환경 대중교통 이용 전환 및 에코 머니백 리워드 플랫폼"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.1
  google_maps_flutter: ^2.6.2
  flutter_dotenv: ^5.1.0
  pedometer: ^4.0.1
  permission_handler: ^11.3.1
  universal_html: ^2.2.4
  supabase_flutter: ^2.6.0
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.9

flutter:
  uses-material-design: true
  assets:
    - .env
